<mat-accordion>
  <mat-expansion-panel class="bg-primary" [(expanded)]="panelOpen">
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{ "section" | translate }}
      </mat-panel-title>
      <mat-panel-description class="department">
        {{ classesService.selectedClass() }}
      </mat-panel-description>
    </mat-expansion-panel-header>

    @for (group of classesService.thisYearClasses(); track $index) {
      <ul class="departments">
        @for (item of group; track item.className) {
          <li
            class="border"
            [class.active]="item.className === classesService.selectedClass()"
          >
            <button
              type="button"
              class="plain-button fill"
              (click)="onClassSelect(item.className)"
            >
              {{ item.className }}
            </button>
          </li>
        }
      </ul>
      <hr />
    }
  </mat-expansion-panel>
</mat-accordion>

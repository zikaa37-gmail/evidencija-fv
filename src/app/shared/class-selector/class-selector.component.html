<mat-accordion>
  <mat-expansion-panel
    class="bg-primary"
    [expanded]="panelOpenState()"
    (click)="togglePanel()"
  >
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{ "section" | translate }}
      </mat-panel-title>
      <mat-panel-description class="department">
        {{ classesService.selectedClass() }}
      </mat-panel-description>
    </mat-expansion-panel-header>

    @for (
      classesArray of classesService.thisYearClasses();
      let i = $index;
      track classesArray
    ) {
      <ul class="departments" (click)="panelOpenState.set(true)">
        @for (item of classesArray; track item) {
          <li
            class="border"
            (click)="onClassSelect(item.className)"
            [ngClass]="{
              active: item.className === classesService.selectedClass(),
            }"
          >
            {{ item.className }}
          </li>
        }
      </ul>
      <hr />
    }
  </mat-expansion-panel>
</mat-accordion>

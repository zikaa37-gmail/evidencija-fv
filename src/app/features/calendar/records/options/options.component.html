<div class="d-flex flex-column p-2">
  <div class="d-flex justify-content-end">
    <button
      type="button"
      class="plain-button m-2"
      [attr.aria-label]="'buttons.close' | translate"
      (click)="closeModal()"
    >
      <i class="fa fa-2x fa-close"></i>
    </button>
  </div>

  @for (option of recordsService.options(); track option.id) {
    <button
      mat-raised-button
      [color]="option.bgColor"
      [style.max-width.px]="150"
      class="d-flex flex-row align-items-center py-2 m-2 option"
      (click)="setOption(option)"
      [title]="option.option | translate"
      [class.active]="option.selected"
    >
      <span class="mx-2">{{ option.option | translate }}</span>
    </button>
  }
</div>

<div class="month">
  <ul>
    <li class="prev">
      <button
        type="button"
        class="plain-button"
        [attr.aria-label]="'buttons.previous' | translate"
        (click)="action.emit('prev')"
      >
        <i class="fa-solid fa-chevron-left"></i>
      </button>
    </li>
    <li class="next">
      <button
        type="button"
        class="plain-button"
        [attr.aria-label]="'buttons.next' | translate"
        (click)="action.emit('next')"
      >
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </li>
    <li>
      {{ "months." + month() | translate | titlecase }}<br /><span>{{
        year()
      }}</span>
    </li>
  </ul>
</div>

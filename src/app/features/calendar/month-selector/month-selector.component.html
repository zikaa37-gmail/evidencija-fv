<div class="month">
  <ul>
    <li class="prev" (click)="action.emit('prev')">
      <i class="fa-solid fa-chevron-left"></i>
    </li>
    <li class="next" (click)="action.emit('next')">
      <i class="fa-solid fa-chevron-right"></i>
    </li>
    <li>
      {{ "months." + month() | translate | titlecase }}<br /><span>{{
        year()
      }}</span>
    </li>
  </ul>
</div>

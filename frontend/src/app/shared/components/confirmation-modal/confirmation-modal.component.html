<h2 mat-dialog-title>{{ data.title | translate }}</h2>
<mat-dialog-content>
  <p>{{ data.question | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  @if (data.leftButtonText) {
    <button mat-raised-button [mat-dialog-close]="false">
      @if (data.leftButtonIcon) {
        <mat-icon class="mx-2">{{ data.leftButtonIcon }}</mat-icon>
      }
      {{ data.leftButtonText | translate }}
    </button>
  }
  <button mat-raised-button [mat-dialog-close]="true" color="primary">
    @if (data.rightButtonIcon) {
      <mat-icon class="mx-2">{{ data.rightButtonIcon }}</mat-icon>
    }
    {{ data.rightButtonText | translate }}
  </button>
</mat-dialog-actions>

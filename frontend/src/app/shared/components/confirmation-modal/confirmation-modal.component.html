<h2 mat-dialog-title>{{ data.title | translate }}</h2>
<mat-dialog-content>
  <p>{{ data.question | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  @if (data.leftButtonText) {
    <button mat-stroked-button [mat-dialog-close]="false">
      @if (data.leftButtonIcon) {
        <span class="svg-icon icon-sm icon-{{ data.leftButtonIcon }}" aria-hidden="true"></span>
      }
      {{ data.leftButtonText | translate }}
    </button>
  }
  <button mat-flat-button [mat-dialog-close]="true">
    @if (data.rightButtonIcon) {
      <span class="svg-icon icon-sm icon-{{ data.rightButtonIcon }}" aria-hidden="true"></span>
    }
    {{ data.rightButtonText | translate }}
  </button>
</mat-dialog-actions>

<nav class="navbar navbar-expand-lg navbar-light bg-default">
  <div class="container-fluid mx-3">
    <a class="navbar-brand" title="Evidencija" alt="Evidencija"
      ><img src="images/logo.png" class="img" alt="Evidencija"
    /></a>
    <button
      class="navbar-toggler"
      type="button"
      data-testid="menu-toggle"
      aria-controls="content"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation"
      (click)="toggleMenu()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="content" [class.show]="menuOpen()">
      @if (auth.currentUser(); as user) {
        <div class="mobile-user d-lg-none">
          <span class="user-name">{{ user.name }}</span>
          <hr />
        </div>
      }

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        @for (link of links(); track link.url) {
          <li class="nav-item">
            <button
              class="nav-link mx-3 active"
              mat-button
              aria-current="page"
              [routerLink]="[link.url]"
              [routerLinkActive]="['router-link-active']"
              (click)="closeMenu()"
            >
              {{ "menu." + link.name | translate }}
            </button>
          </li>
        }
      </ul>

      @if (auth.currentUser(); as user) {
        <div class="user-area">
          <span class="user-name d-none d-lg-inline">{{ user.name }}</span>
          <button
            type="button"
            mat-button
            class="logout"
            data-testid="logout"
            (click)="logout()"
          >
            <span class="svg-icon icon-power icon-sm" aria-hidden="true"></span>
            {{ "menu.logout" | translate }}
          </button>
        </div>
      }
    </div>
  </div>
</nav>

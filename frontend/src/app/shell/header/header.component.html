<nav class="navbar navbar-expand-lg navbar-light bg-default">
  <div class="container-fluid mx-3">
    <a class="navbar-brand" title="Evidencija" alt="Evidencija"
      ><img src="images/logo.png" class="img" alt="Evidencija"
    /></a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#content"
      aria-controls="content"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="content">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        @for (link of links(); track link.url) {
          <li class="nav-item">
            <button
              class="nav-link mx-3 active"
              mat-button
              aria-current="page"
              [routerLink]="[link.url]"
              [routerLinkActive]="['router-link-active']"
            >
              {{ "menu." + link.name | translate }}
            </button>
          </li>
        }
      </ul>

      @if (auth.currentUser(); as user) {
        <div class="d-flex align-items-center user-area">
          <span class="mx-2 user-name">{{ user.name }}</span>
          <button
            type="button"
            mat-icon-button
            class="mx-1"
            data-testid="logout"
            [attr.aria-label]="'menu.logout' | translate"
            [title]="'menu.logout' | translate"
            (click)="auth.logout()"
          >
            <span class="svg-icon icon-logout" aria-hidden="true"></span>
          </button>
        </div>
      }
    </div>
  </div>
</nav>

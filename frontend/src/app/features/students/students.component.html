<div class="d-flex flex-row justify-content-between no-wrap my-4 mx-2">
  <h4>{{ "students.students" | translate }}</h4>

  @if (auth.isAdmin()) {
    <div class="d-flex flex-row no-wrap">
      <button
        mat-raised-button
        color="primary"
        class="mx-1"
        data-testid="new-student"
        (click)="openForm()"
      >
        {{ "students.create" | translate }}
      </button>
      <button mat-raised-button class="mx-1" (click)="gotoUpload()">
        {{ "buttons.upload" | translate }}
      </button>
    </div>
  }
</div>

<hr />
@if (classesService.thisYearClasses().length) {
  <app-class-selector />
}

<hr />

<div
  class="d-flex flex-row justify-content-around flex-wrap overflow-auto card-container"
>
  @for (student of studentsService.filteredStudents(); track student.id) {
    <app-card
      class="mx-2 my-2"
      [item]="student"
      [editable]="auth.isAdmin()"
      (edited)="openForm($event)"
      (deletedItem)="onStudentDelete($event)"
      (reactivatedItem)="onStudentReactivate($event)"
    />
  } @empty {
    {{ "general.noItems" | translate }}
  }
</div>

<ul class="weekdays">
  @for (day of days(); track day) {
    <li>
      @if (!globalService.isMobile()) {
        <span>{{ "days." + day | translate }}</span>
      } @else {
        <span>{{ ("days." + day | translate).charAt(0) }}</span>
      }
    </li>
  }
</ul>

<ul class="days">
  @for (date of dates(); track $index) {
    @if (date) {
      <li>
        <button
          type="button"
          class="plain-button fill"
          [disabled]="lastSelectableDay() !== null && date > lastSelectableDay()!"
          (click)="dateSelect.emit(date)"
        >
          <span
            [class.active]="date === selected()"
            [class.marked]="marked().has(date)"
            [class.read-only]="readOnlyDays().has(date)"
            >{{ date }}</span
          >
        </button>
      </li>
    } @else {
      <li></li>
    }
  }
</ul>

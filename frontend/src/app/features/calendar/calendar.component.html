<app-class-selector />

<app-month-selector
  [month]="monthName()"
  [year]="year()"
  (action)="onMonthChange($event)"
/>

<app-calendar-body
  [dates]="dates()"
  [days]="days"
  [selected]="selectedDay()"
  [marked]="recordsService.markedDays()"
  [lastSelectableDay]="lastSelectableDay()"
  [readOnlyDays]="readOnlyDays()"
  (dateSelect)="onDateSelect($event)"
/>

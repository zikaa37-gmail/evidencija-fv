<div class="d-flex flex-column p-3">
  <strong>{{ student.first_name }} {{ student.last_name }}</strong>
  <label for="note-text" class="mt-2">{{ "notes.note" | translate }}</label>

  <div class="d-flex flex-row justify-content-start my-4 w-100">
    <div class="d-flex flex-column justify-content-center align-items-center">
      <button
        type="button"
        class="note-type tone-green mx-3"
        [class.selected]="type() === NOTE_TYPE.GOOD"
        [attr.aria-pressed]="type() === NOTE_TYPE.GOOD"
        (click)="type.set(NOTE_TYPE.GOOD)"
      >
        <span class="svg-icon icon-smile icon-lg" aria-hidden="true"></span>
      </button>
      {{ "notes.praise" | translate }}
    </div>

    <div class="d-flex flex-column justify-content-center align-items-center">
      <button
        type="button"
        class="note-type tone-red mx-3"
        [class.selected]="type() === NOTE_TYPE.BAD"
        [attr.aria-pressed]="type() === NOTE_TYPE.BAD"
        (click)="type.set(NOTE_TYPE.BAD)"
      >
        <span class="svg-icon icon-frown icon-lg" aria-hidden="true"></span>
      </button>
      {{ "notes.warning" | translate }}
    </div>
  </div>

  <textarea
    id="note-text"
    cdkFocusInitial
    rows="6"
    class="w-100 p-3"
    [value]="text()"
    (input)="text.set($any($event.target).value)"
    [placeholder]="'notes.addNote' | translate"
  ></textarea>

  <div class="d-flex flex-row justify-content-between my-4 w-100">
    <button type="button" mat-stroked-button (click)="closeModal()">
      {{ "notes.cancel" | translate }}
    </button>

    <button
      type="button"
      class="mx-3"
      mat-flat-button
      data-testid="save-note"
      [disabled]="saving() || !text().trim()"
      (click)="addNote()"
    >
      {{ "notes.addNote" | translate }}
    </button>
  </div>
</div>
